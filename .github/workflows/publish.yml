name: publish

# Publishes the extension with trusted publishing (OIDC). No long-lived
# registry token is stored. Each registry exchanges this workflow's GitHub
# ID token for a short-lived credential.
#
# Open VSX, one-time setup at https://open-vsx.org -> Settings -> Trusted Publishers:
#   namespace          yeeth
#   organization/user  yeeth-security
#   repository         dev-guard
#   workflow filename  publish.yml
#   environment        publish
#
# Visual Studio Marketplace publishes as yeeth.pkgscan. The name dev-guard
# is already taken on that registry, so this job rewrites package.json
# before vsce runs. Open VSX keeps the name dev-guard.
# One-time setup on the yeeth publisher
# (https://marketplace.visualstudio.com/manage/publishers/yeeth -> Trusted Publishing):
#   Policy name        Release workflow
#   Repository owner   yeeth-security
#   Repository         dev-guard
#   Workflow           publish.yml
#   Environment        publish
# The publisher name comes from package.json ("yeeth"). The repository owner
# is the GitHub org, which is yeeth-security. A private repo must run this
# workflow within 48 hours of creating the policy so the first token exchange
# can activate it.
#
# The two registries are separate jobs, so a failure on one still lets the
# other publish. --skip-duplicate treats "this version is already published"
# as success. A different failure, such as the extension name belonging to
# another publisher, still fails that job.
#
# A manual run can start from a branch, because that is where the current
# workflow file lives. The job then checks out the version tag from
# package.json and publishes that commit.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  open-vsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the environment in the trusted publisher registration.
    environment: publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Tags and history are required when a manual run starts from a
          # branch and the next step checks out the released version tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # GitHub runs this workflow file from the branch selected in the UI.
      # Publish the tagged release that package.json names, not the branch tip.
      - name: Check out the released version tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "No tag $TAG for package.json version $VERSION. Run the release workflow before publishing." >&2
            exit 1
          fi
          git checkout --detach "$TAG"
          echo "Checked out $TAG ($(git rev-parse --short HEAD)) from $GITHUB_REF"

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$RELEASE_TAG" ] && [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "package.json version $VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish to Open VSX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing dev-guard $VERSION to Open VSX via trusted publishing"
          npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate

  marketplace:
    name: Publish to Visual Studio Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the environment in the trusted publisher registration.
    environment: publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Tags and history are required when a manual run starts from a
          # branch and the next step checks out the released version tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # GitHub runs this workflow file from the branch selected in the UI.
      # Publish the tagged release that package.json names, not the branch tip.
      - name: Check out the released version tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "No tag $TAG for package.json version $VERSION. Run the release workflow before publishing." >&2
            exit 1
          fi
          git checkout --detach "$TAG"
          echo "Checked out $TAG ($(git rev-parse --short HEAD)) from $GITHUB_REF"

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$RELEASE_TAG" ] && [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "package.json version $VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      # vsce 4.1.0 is the release that publishes with --oidc. It asks for
      # confirmation when activationEvents is "*", and CI cannot answer, so
      # --allow-star-activation is required. The star event lets Dev-Guard
      # start in Restricted Mode.
      - name: Publish to Visual Studio Marketplace
        run: |
          # Marketplace names are unique across publishers. dev-guard is taken,
          # so this publish uses pkgscan. The file is not committed.
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='pkgscan'; fs.writeFileSync('package.json', JSON.stringify(p, null, 4)+'\n');"
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing yeeth.pkgscan $VERSION to the Visual Studio Marketplace via trusted publishing"
          npx --yes @vscode/vsce@4.1.0 publish --oidc --allow-star-activation --skip-duplicate
