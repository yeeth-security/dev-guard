name: publish

# Publishes the extension with trusted publishing (OIDC). No long-lived
# registry token is stored. Each registry exchanges this workflow's GitHub
# ID token for a short-lived credential.
#
# Open VSX, one-time setup at https://open-vsx.org -> Settings -> Trusted Publishers:
#   namespace          yeeth
#   organization/user  yeeth-security
#   repository         dev-guard
#   workflow filename  publish.yml
#   environment        publish
#
# Visual Studio Marketplace, one-time setup on the yeeth publisher
# (https://marketplace.visualstudio.com/manage/publishers/yeeth -> Trusted Publishing):
#   Policy name        Release workflow
#   Repository owner   yeeth-security
#   Repository         dev-guard
#   Workflow           publish.yml
#   Environment        publish
# The publisher name comes from package.json ("yeeth"). The repository owner
# is the GitHub org, which is yeeth-security. A private repo must run this
# workflow within 48 hours of creating the policy so the first token exchange
# can activate it.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two registries. Each publish downloads its CLI, then exchanges an OIDC token.
    timeout-minutes: 20
    # Must match the environment in the trusted publisher registration.
    environment: publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Require a version tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "Refusing to publish from '$GITHUB_REF': publish a version tag instead (use the release workflow)." >&2
          exit 1

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$RELEASE_TAG" ] && [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "package.json version $VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish to Open VSX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing dev-guard $VERSION to Open VSX via trusted publishing"
          npx --yes ovsx@1.3.0 publish --trusted-publishing

      # vsce 4.1.0 is the release that publishes with --oidc. It asks for
      # confirmation when activationEvents is "*", and CI cannot answer, so
      # --allow-star-activation is required. The star event lets Dev-Guard
      # start in Restricted Mode.
      - name: Publish to Visual Studio Marketplace
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing dev-guard $VERSION to the yeeth Marketplace publisher via trusted publishing"
          npx --yes @vscode/vsce@4.1.0 publish --oidc --allow-star-activation
