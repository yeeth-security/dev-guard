name: release

# Cuts a GitHub Release for the version in package.json.
#
# Runs automatically on every push to main. If the version in package.json is
# already tagged/released the run is a no-op, so the flow is:
#   1. Bump "version" in package.json.
#   2. Merge to main.
#   3. This workflow validates the JS, packages the VSIX, tags v<version>,
#      publishes the release (notes + SHA256 checksum), then dispatches the
#      Open VSX publish workflow.
#
# Releases created with GITHUB_TOKEN do not trigger other workflows, which is
# why the publish workflow is dispatched explicitly. Manual dispatch is still
# available for re-releasing a specific version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        type: boolean
        default: false
      publish:
        description: Trigger the Open VSX publish workflow after releasing
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "package.json version '$VERSION' is not a semver version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version $VERSION"

      - name: Decide whether this version still needs a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Manual runs always proceed; the next step fails loudly if the
          # version was already released.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already released; nothing to do. Bump package.json to release a new version."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite an existing tag or release
        if: steps.check.outputs.release == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; bump package.json first." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump package.json first." >&2
            exit 1
          fi

      - name: Validate extension sources
        if: steps.check.outputs.release == 'true'
        run: node --check extension.js && node --check telemetry.js

      - name: Package VSIX and checksum
        if: steps.check.outputs.release == 'true'
        id: package
        run: |
          VSIX="dev-guard-${{ steps.version.outputs.version }}.vsix"
          npx --yes @vscode/vsce@3 package --out "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "sha256=$VSIX.sha256" >> "$GITHUB_OUTPUT"
          cat "$VSIX.sha256"

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          args=(--title "$TAG" --generate-notes --target "$GITHUB_SHA")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" \
            "${{ steps.package.outputs.vsix }}" \
            "${{ steps.package.outputs.sha256 }}"

      - name: Trigger Open VSX publish
        if: steps.check.outputs.release == 'true' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.version.outputs.tag }}"
