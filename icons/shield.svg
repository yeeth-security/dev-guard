<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- Shield outline: DevGuard Activity Bar icon. Single color so VS Code can recolor it. -->
  <!-- Drawn on the same 16x16 grid as VS Code's built-in codicons so it lines up with them. -->
  <!-- The shape spans x 3–13 and y 1–15, so its center sits exactly at (8, 8). -->
  <!-- The previous 24x24 version rendered slightly low/left next to the built-in icons. -->
  <path d="M8 1 3 3v4.2c0 3.3 2.1 5.9 5 6.8 2.9-.9 5-3.5 5-6.8V3L8 1z"/>
  <!-- Check mark, centered on the shield -->
  <path d="M5.7 7.9l1.6 1.6 3-3.2"/>
</svg>
